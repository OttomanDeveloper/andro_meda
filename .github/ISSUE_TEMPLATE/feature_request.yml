name: ✨ Feature request
description: Suggest a new era, scene, interaction, or improvement
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: Describe the new era, scene, interaction, or improvement.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is this valuable?
      description: What does it add to the experience?
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: References, mockups, or anything else that helps.
    validations:
      required: false
